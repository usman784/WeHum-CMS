<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WeHum CMS sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; min-height: 960px; background: #0B0D0E; font-family: 'Inter', sans-serif; color: #F2F2F2">

<section aria-label="WeHum" style="background: #123C3A; display: flex; flex-direction: column; justify-content: space-between; padding: 56px; box-sizing: border-box; position: relative; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="40" height="40" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#FF7A45" stroke-width="3.5" stroke-dasharray="52 18" stroke-linecap="round"></circle><circle cx="15" cy="15" r="6" fill="#4ADE80"></circle><circle cx="15" cy="15" r="2.4" fill="#0B0D0E"></circle></svg>
<span style="font-size: 24px; font-weight: 700">WeHum</span>
</div>
<div style="display: flex; align-items: center; justify-content: center">
<svg width="360" height="360" viewBox="0 0 360 360" aria-hidden="true">
<circle cx="180" cy="180" r="170" fill="none" stroke="#2F6B66" stroke-width="1" stroke-dasharray="3 7"></circle>
<circle cx="180" cy="180" r="130" fill="none" stroke="#FF7A45" stroke-width="6" stroke-dasharray="560 260" stroke-linecap="round" transform="rotate(-80 180 180)"></circle>
<circle cx="180" cy="180" r="130" fill="none" stroke="#4ADE80" stroke-width="6" stroke-dasharray="120 700" stroke-linecap="round" transform="rotate(150 180 180)"></circle>
<circle cx="180" cy="50" r="7" fill="#4ADE80"></circle>
<circle cx="62" cy="236" r="6" fill="#FFB99A"></circle>
<circle cx="300" cy="250" r="5" fill="#4ADE80"></circle>
<text x="180" y="176" text-anchor="middle" font-size="52" font-weight="700" fill="#F2F2F2" font-family="Inter, sans-serif">3,180</text>
<text x="180" y="210" text-anchor="middle" font-size="15" fill="#9FE3D6" font-family="Inter, sans-serif">meditated together today</text>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 28px; font-weight: 700; line-height: 1.25; max-width: 440px">Everything people hear in WeHum starts here.</span>
<span style="font-size: 15px; color: #9FE3D6">Sessions, programs, daily messages and the community, in one place.</span>
</div>
</section>

<section style="display: flex; align-items: center; justify-content: center; padding: 48px">
<form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #FF9B70">ADMIN CMS</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.4px">Sign in</h1>
<span style="font-size: 14px; color: #A0A4A8">Admins and editors only. Ask the owner for an invite.</span>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #C9CCCF">Email
<input type="email" placeholder="you@wehum.app" style="height: 48px; padding: 0 14px; border-radius: 12px; background: #17191B; border: 1px solid #2A2D30; color: #F2F2F2; font-family: inherit; font-size: 15px">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #C9CCCF">Password
<input type="password" placeholder="At least 8 characters" style="height: 48px; padding: 0 14px; border-radius: 12px; background: #17191B; border: 1px solid #2A2D30; color: #F2F2F2; font-family: inherit; font-size: 15px">
</label>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px">
<label style="display: flex; align-items: center; gap: 8px; color: #C9CCCF"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #FF7A45">Keep me signed in</label>
<a href="#" style="font-weight: 600; text-decoration: none">Forgot password?</a>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; background: #FF7A45; color: #2A0E02; font-size: 15px; font-weight: 700; text-decoration: none">Sign in</a>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7378"><span style="flex-grow: 1; height: 1px; background: #23262A"></span>OR<span style="flex-grow: 1; height: 1px; background: #23262A"></span></div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; background: #17191B; border: 1px solid #2A2D30; color: #F2F2F2; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"></path><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 5.9 12 5.9z" fill="#EA4335"></path></svg>Continue with Google</a>
<span style="font-size: 13px; color: #6E7378; text-align: center">Protected by two-step verification for admin accounts</span>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
