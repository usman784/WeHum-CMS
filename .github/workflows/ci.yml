name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ENV: staging
      VITE_API_URL: https://api.staging.wehum.app
      VITE_SOCKET_URL: https://api.staging.wehum.app
      VITE_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The generated API types must match the committed contract (spec §14).
      - run: pnpm api:types
      - name: API types are up to date
        run: git diff --exit-code -- src/lib/api-types.ts

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm stories:build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
